<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="./icon.ico" type="image/ico" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CYBERLEEK · Media Gallery</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #00050d;
    --card: #00102b;
    --card-2: #00173d;
    --border: #003299;
    --neon: #0064ec;
    --green: #60c33a;
    --red: #ff3355;
    --gold: #f5c542;
    --cyan: #34d6d6;
    --text: #a0b0c8;
    --text-bright: #d6efc1;
    --text-dim: #6a7a90;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Courier New", "Lucida Console", monospace;
    min-height: 100vh;
    padding: 1rem;
    line-height: 1.45;
  }

  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 4px,
      rgba(0, 0, 0, 0.04) 4px,
      rgba(0, 0, 0, 0.04) 8px
    );
    pointer-events: none;
    z-index: 9999;
  }

  .wrapper {
    max-width: 1440px;
    width: 100%;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    padding: 1.1rem 1.35rem;
    box-shadow: 0 0 40px rgba(0, 100, 236, 0.08);
  }

  .header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.65rem;
    margin-bottom: 0.9rem;
  }

  .header h1 {
    font-size: 1.35rem;
    font-weight: 900;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--neon);
    text-shadow: 0 0 30px rgba(0, 100, 236, 0.25);
  }

  .sub {
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 1.5px;
    margin-top: 3px;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .btn {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 5px 10px;
    font-family: inherit;
    font-size: 0.72rem;
    letter-spacing: 0.5px;
    text-decoration: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }

  .btn:hover {
    border-color: var(--neon);
    color: var(--text-bright);
    background: var(--card-2);
  }

  .btn.active {
    background: rgba(0, 100, 236, 0.22);
    border-color: var(--neon);
    color: var(--text-bright);
    font-weight: 700;
  }

  .btn.accent {
    color: var(--cyan);
    border-color: rgba(52, 214, 214, 0.45);
  }

  .controls-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 0.65rem 0.8rem;
    margin-bottom: 1rem;
  }

  .filter-cluster {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  select.filter-select {
    background: var(--card);
    color: var(--text-bright);
    border: 1px solid var(--border);
    padding: 5px 9px;
    font-family: inherit;
    font-size: 0.72rem;
    min-width: 240px;
  }

  select.filter-select.unselected {
    color: #888888;
  }

  select.filter-select option {
    color: var(--text-bright);
    background: var(--card);
  }

  select.filter-select option.placeholder-opt {
    color: #888888;
  }

  select.filter-select:focus {
    outline: none;
    border-color: var(--neon);
  }

  .cat-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  input[type="search"] {
    background: var(--card);
    color: var(--text-bright);
    border: 1px solid var(--border);
    padding: 5px 9px;
    font-family: inherit;
    font-size: 0.72rem;
    min-width: 210px;
  }

  input[type="search"]:focus {
    outline: none;
    border-color: var(--neon);
  }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 0.85rem;
  }

  .media-card {
    background: var(--bg);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: border-color 0.15s, background 0.15s;
  }

  .media-card:hover {
    border-color: var(--neon);
    background: var(--card-2);
  }

  .thumb-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    background: #020814;
    border-bottom: 1px dashed var(--border);
    overflow: hidden;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.2s ease;
  }

  .media-card:hover .thumb-wrap img {
    transform: scale(1.02);
  }

  .missing-badge {
    padding: 0.5rem;
    text-align: center;
    font-size: 0.68rem;
    color: var(--red);
    word-break: break-all;
  }

  .media-body {
    padding: 0.7rem 0.8rem;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    flex: 1;
    justify-content: space-between;
  }

  .media-cat {
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--cyan);
    border: 1px solid currentColor;
    border-radius: 3px;
    padding: 0 5px;
    display: inline-block;
    width: fit-content;
  }

  .media-title {
    color: var(--text-bright);
    font-size: 0.82rem;
    font-weight: 700;
    word-break: break-word;
  }

  .media-caption {
    color: var(--text-dim);
    font-size: 0.7rem;
  }

  .media-path {
    color: var(--neon);
    font-size: 0.64rem;
    word-break: break-all;
    margin-top: 0.2rem;
  }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 2rem 1rem;
    border: 1px dashed var(--border);
    background: var(--bg);
    color: var(--text-dim);
    font-size: 0.78rem;
  }

  .select-filter-prompt {
    color: #888888;
    font-size: 0.82rem;
    letter-spacing: 1px;
  }

  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 5, 13, 0.92);
    z-index: 10000;
    padding: 1.2rem;
    align-items: center;
    justify-content: center;
  }

  .lightbox.open {
    display: flex;
  }

  .lightbox-box {
    max-width: 1100px;
    width: 100%;
    max-height: 92vh;
    background: var(--card);
    border: 1px solid var(--neon);
    padding: 0.9rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
    box-shadow: 0 0 50px rgba(0, 100, 236, 0.25);
  }

  .lightbox-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    border-bottom: 1px dashed var(--border);
    padding-bottom: 0.5rem;
  }

  .lightbox-img-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    border: 1px solid var(--border);
    overflow: auto;
    padding: 0.5rem;
  }

  .lightbox-img-wrap img {
    max-width: 100%;
    max-height: 70vh;
    object-fit: contain;
    display: block;
  }

  .lightbox-footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-size: 0.7rem;
    color: var(--text-dim);
  }

  .footer {
    text-align: center;
    font-size: 0.68rem;
    color: var(--text-dim);
    letter-spacing: 2px;
    border-top: 1px solid var(--border);
    padding-top: 0.6rem;
    margin-top: 1rem;
  }

  @media (max-width: 768px) {
    body { padding: 0.65rem; overflow-x: hidden; }
    .wrapper { padding: 0.85rem 0.9rem; }
    .header h1 { font-size: 1.05rem; }
    select.filter-select, input[type="search"] { width: 100%; min-width: 0; }
    .gallery-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="wrapper">
    <header class="header">
      <div>
        <h1>CYBERLEEK · INFO GALLERY</h1>
        <div class="sub" id="statusSub">MEDIA UNDER ./media/</div>
      </div>
      <div class="toolbar">
        <a href="./index.html" class="btn accent">← HUB</a>
      </div>
    </header>

    <div class="controls-row">
      <div class="filter-cluster">
        <select id="filterSelect" class="filter-select unselected" aria-label="Select a filter">
          <option value="" class="placeholder-opt" selected>select a filter</option>
        </select>
        <div class="cat-tabs" id="categoryTabs"></div>
      </div>
      <input type="search" id="searchInput" placeholder="Search database, path, resolution, or filename..." />
    </div>

    <div class="gallery-grid" id="galleryGrid"></div>

    <div class="footer">provided by n0ne</div>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image preview">
    <div class="lightbox-box">
      <div class="lightbox-top">
        <div>
          <span class="media-cat" id="lbCategory"></span>
          <div class="media-title" id="lbTitle" style="margin-top:4px;"></div>
          <div class="media-caption" id="lbCaption" style="margin-top:2px;"></div>
        </div>
        <button type="button" class="btn" id="lbClose">CLOSE [ESC]</button>
      </div>
      <div class="lightbox-img-wrap">
        <img id="lbImg" src="" alt="" />
      </div>
      <div class="lightbox-footer">
        <span id="lbPath"></span>
        <a id="lbRawLink" href="#" target="_blank" rel="noopener noreferrer" class="btn">OPEN RAW IMAGE →</a>
      </div>
    </div>
  </div>

<script>
const MANIFEST_PATH = "./media/manifest.json";
let manifestError = "";
let allItems = [];
let activeFilter = "";
let searchQuery = "";

function encodePathSegments(pathStr) {
  return String(pathStr)
    .split("/")
    .map((seg, idx) => {
      if (idx === 0 && (seg === "." || seg === "")) return seg;
      return encodeURIComponent(seg);
    })
    .join("/");
}

function toMediaRelativeSrc(rawVal, fallbackFolder = "") {
  let cleaned = String(rawVal || "").trim().replace(/\\/g, "/");
  while (cleaned.startsWith("./")) cleaned = cleaned.slice(2);
  cleaned = cleaned.replace(/^\/+/, "");
  if (!cleaned) return "";

  if (cleaned === "media" || cleaned.startsWith("media/")) {
    return `./${cleaned}`;
  }
  if (fallbackFolder) {
    if (cleaned === fallbackFolder || cleaned.startsWith(`${fallbackFolder}/`)) {
      return `./media/${cleaned}`;
    }
    return `./media/${fallbackFolder}/${cleaned}`;
  }
  return `./media/${cleaned}`;
}

function parseSheetPathMeta(cleanSrc) {
  const norm = String(cleanSrc).split("\\").join("/");
  const match = norm.match(/(?:^|\/)_sheets\/([^/]+)\/([^/]+)\/([^/]+)\/([^/]+)$/);
  if (!match) return null;
  return {
    group: match[1],
    database: match[2],
    resolution: match[3],
    filename: match[4],
  };
}

function normalizeManifest(manifestObj) {
  const items = [];
  if (!manifestObj || typeof manifestObj !== "object") return items;

  // every list in the manifest is a category (named after its folder), except the sheet lists
  const topCategories = Object.keys(manifestObj).filter(
    (k) => Array.isArray(manifestObj[k]) && k !== "sheets" && k !== "entries"
  );
  topCategories.forEach((catKey) => {
    const arr = manifestObj[catKey];
    if (!Array.isArray(arr)) return;
    arr.forEach((entry) => {
      if (!entry) return;
      const rawVal = typeof entry === "string"
        ? entry.trim()
        : String(entry.file || entry.path || entry.src || entry.name || "").trim();
      if (!rawVal) return;

      const src = toMediaRelativeSrc(rawVal, catKey);
      if (!src) return;
      const displayName = rawVal.split("/").pop();

      items.push({
        category: catKey,
        group: catKey,
        database: "",
        resolution: "",
        isSheet: false,
        file: displayName,
        src,
        title: displayName,
        caption: `Category: ${catKey} | Path: ${src}`,
      });
    });
  });

  const sheetList = Array.isArray(manifestObj.sheets)
    ? manifestObj.sheets
    : Array.isArray(manifestObj.entries)
    ? manifestObj.entries
    : [];

  sheetList.forEach((entry) => {
    if (!entry) return;
    const rawPath = String(entry.path || entry.src || entry.id || entry.file || "").trim();
    if (!rawPath) return;

    const src = toMediaRelativeSrc(rawPath);
    if (!src) return;
    const meta = parseSheetPathMeta(src);
    const dbKey = entry.database || (meta ? meta.database : entry.category || "sheets");
    const res = entry.resolution || (meta ? meta.resolution : "");
    const grp = entry.group || (meta ? meta.group : "");
    const fname = entry.name || (meta ? meta.filename : src.split("/").pop());

    items.push({
      category: dbKey,
      group: grp,
      database: dbKey,
      resolution: res,
      isSheet: true,
      file: meta ? `${meta.group}/${meta.database}/${meta.resolution}/${meta.filename}` : fname,
      src,
      title: String(entry.title || `${dbKey}${res ? ` · ${res}` : ""} · ${fname}`),
      caption: String(entry.caption || `Path: ${src}`),
    });
  });

  items.sort((a, b) => {
    const cCmp = (a.category || "").localeCompare(b.category || "");
    if (cCmp !== 0) return cCmp;
    return (a.src || "").localeCompare(b.src || "");
  });

  return items;
}

function getSheetDatabases() {
  return Array.from(
    new Set(allItems.filter((i) => i.isSheet && i.database).map((i) => i.database))
  ).sort((a, b) => a.localeCompare(b));
}

function groupOf(item) {
  return item.group || item.database || "sheets";
}

function getSheetGroups() {
  return Array.from(
    new Set(allItems.filter((i) => i.isSheet).map(groupOf))
  ).sort((a, b) => a.localeCompare(b));
}

function getTopCategories() {
  return Array.from(
    new Set(allItems.filter((i) => !i.isSheet && i.category).map((i) => i.category))
  ).sort((a, b) => a.localeCompare(b));
}

function renderFilterControls() {
  const selectEl = document.getElementById("filterSelect");
  const tabsEl = document.getElementById("categoryTabs");
  const totalCount = allItems.length;
  const sheetCount = allItems.filter((i) => i.isSheet).length;
  const topCats = getTopCategories();
  const groups = getSheetGroups();
  const prevVal = activeFilter;

  const options = [
    `<option value="" class="placeholder-opt"${prevVal === "" ? " selected" : ""}>select a filter</option>`,
    `<option value="all"${prevVal === "all" ? " selected" : ""}>all (${totalCount})</option>`,
    ...topCats.map((cat) => {
      const cnt = allItems.filter((i) => !i.isSheet && i.category === cat).length;
      return `<option value="cat:${cat}"${prevVal === `cat:${cat}` ? " selected" : ""}>${cat} (${cnt})</option>`;
    }),
    ...(sheetCount ? [`<option value="sheets"${prevVal === "sheets" ? " selected" : ""}>sheets (${sheetCount})</option>`] : []),
    ...groups.map((g) => {
      const cnt = allItems.filter((i) => i.isSheet && groupOf(i) === g).length;
      return `<option value="grp:${g}"${prevVal === `grp:${g}` ? " selected" : ""}>${g} (${cnt})</option>`;
    }),
  ];

  selectEl.innerHTML = options.join("");
  selectEl.classList.toggle("unselected", activeFilter === "");

  const tabDefs = [
    { key: "all", label: `all (${totalCount})` },
    ...topCats.map((cat) => ({
      key: `cat:${cat}`,
      label: `${cat} (${allItems.filter((i) => !i.isSheet && i.category === cat).length})`,
    })),
    ...(sheetCount ? [{ key: "sheets", label: `sheets (${sheetCount})` }] : []),
    ...groups.map((g) => ({
      key: `grp:${g}`,
      label: `${g} (${allItems.filter((i) => i.isSheet && groupOf(i) === g).length})`,
    })),
  ];

  tabsEl.innerHTML = tabDefs
    .map(
      (t) =>
        `<button type="button" class="btn ${activeFilter === t.key ? "active" : ""}" data-filter="${t.key}">${t.label}</button>`
    )
    .join("");

  tabsEl.querySelectorAll("button[data-filter]").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeFilter = btn.dataset.filter || "";
      renderFilterControls();
      renderGallery();
    });
  });
}

function attachImageLoader(imgEl, thumbEl, src) {
  const safeSrc = encodePathSegments(src);
  let retried = false;

  imgEl.addEventListener("error", () => {
    if (!retried) {
      retried = true;
      setTimeout(() => {
        imgEl.src = `${safeSrc}${safeSrc.includes("?") ? "&" : "?"}retry=1`;
      }, 250);
      return;
    }
    imgEl.style.display = "none";
    if (!thumbEl.querySelector(".missing-badge")) {
      const badge = document.createElement("div");
      badge.className = "missing-badge";
      badge.textContent = `Missing: ${src}`;
      thumbEl.appendChild(badge);
    }
  });

  imgEl.src = safeSrc;
}

function openLightbox(item) {
  const safeSrc = encodePathSegments(item.src);
  document.getElementById("lbCategory").textContent = item.database || item.category;
  document.getElementById("lbTitle").textContent = item.title;
  document.getElementById("lbCaption").textContent = item.caption || "";
  document.getElementById("lbCaption").style.display = item.caption ? "block" : "none";
  const img = document.getElementById("lbImg");
  img.src = safeSrc;
  img.alt = item.title;
  document.getElementById("lbPath").textContent = item.src;
  document.getElementById("lbRawLink").href = safeSrc;
  document.getElementById("lightbox").classList.add("open");
}

function closeLightbox() {
  document.getElementById("lightbox").classList.remove("open");
  document.getElementById("lbImg").src = "";
}

function matchesActiveFilter(item) {
  if (!activeFilter || activeFilter === "all") return true;
  if (activeFilter === "sheets") return Boolean(item.isSheet);
  if (activeFilter.startsWith("cat:")) {
    const catName = activeFilter.slice(4);
    return !item.isSheet && item.category === catName;
  }
  if (activeFilter.startsWith("grp:")) {
    const grpName = activeFilter.slice(4);
    return Boolean(item.isSheet && groupOf(item) === grpName);
  }
  if (activeFilter.startsWith("db:")) {
    const dbName = activeFilter.slice(3);
    return Boolean(item.isSheet && item.database === dbName);
  }
  return item.database === activeFilter || item.category === activeFilter;
}

function renderGallery() {
  const grid = document.getElementById("galleryGrid");
  const q = searchQuery.trim().toLowerCase();

  if (manifestError && !allItems.length) {
    grid.innerHTML = `<div class="empty-state">Could not load <code>./media/manifest.json</code> (${manifestError}).</div>`;
    return;
  }

  if (!activeFilter && !q) {
    grid.innerHTML = `<div class="empty-state"><span class="select-filter-prompt">select a filter</span></div>`;
    return;
  }

  const filtered = allItems.filter((item) => {
    const filterMatch = matchesActiveFilter(item);
    const textMatch =
      !q ||
      item.title.toLowerCase().includes(q) ||
      item.caption.toLowerCase().includes(q) ||
      (item.database || "").toLowerCase().includes(q) ||
      (item.resolution || "").toLowerCase().includes(q) ||
      (item.group || "").toLowerCase().includes(q) ||
      item.src.toLowerCase().includes(q) ||
      item.file.toLowerCase().includes(q);

    return filterMatch && textMatch;
  });

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state">No media items match the selected filter or search query.</div>`;
    return;
  }

  grid.innerHTML = filtered
    .map(
      (item, idx) => `
      <article class="media-card" data-card-idx="${idx}">
        <div class="thumb-wrap" title="Click to preview full image">
          <img alt="${item.title}" loading="lazy" />
        </div>
        <div class="media-body">
          <div>
            <span class="media-cat">${item.database || item.category}</span>
            <div class="media-title" style="margin-top:5px;">${item.title}</div>
            ${item.resolution ? `<div class="media-caption" style="margin-top:3px;">Resolution: ${item.resolution}${item.group ? ` · ${item.group}` : ""}</div>` : ""}
          </div>
          <div class="media-path">${item.src}</div>
        </div>
      </article>
    `
    )
    .join("");

  grid.querySelectorAll(".media-card").forEach((cardEl, idx) => {
    const item = filtered[idx];
    const imgEl = cardEl.querySelector("img");
    const thumbEl = cardEl.querySelector(".thumb-wrap");

    attachImageLoader(imgEl, thumbEl, item.src);
    thumbEl.addEventListener("click", () => openLightbox(item));
  });
}

async function initGallery() {
  manifestError = "";
  let manifestData = {};
  try {
    const resp = await fetch(MANIFEST_PATH, { cache: "no-store" });
    if (!resp.ok) {
      throw new Error(`HTTP ${resp.status} for ${MANIFEST_PATH}`);
    }
    const json = await resp.json();
    if (!json || typeof json !== "object") {
      throw new Error("Invalid manifest JSON structure.");
    }
    manifestData = json;
  } catch (err) {
    manifestError = err && err.message ? err.message : String(err);
  }

  allItems = normalizeManifest(manifestData);
  renderFilterControls();
  renderGallery();

  const dbCount = getSheetDatabases().length;
  const sheetCount = allItems.filter((i) => i.isSheet).length;
  const mediaCount = allItems.filter((i) => !i.isSheet).length;
  document.getElementById("statusSub").textContent = manifestError
    ? `MANIFEST ERROR (${MANIFEST_PATH}) · ${manifestError}`
    : sheetCount
    ? `${mediaCount} MEDIA FILES · ${dbCount} SHEET DATABASES · ${sheetCount} SHEETS INDEXED`
    : `${mediaCount} MEDIA FILES`;
}

document.getElementById("filterSelect").addEventListener("change", (e) => {
  activeFilter = e.target.value;
  e.target.classList.toggle("unselected", activeFilter === "");
  renderFilterControls();
  renderGallery();
});

document.getElementById("searchInput").addEventListener("input", (e) => {
  searchQuery = e.target.value;
  renderGallery();
});

document.getElementById("lbClose").addEventListener("click", closeLightbox);
document.getElementById("lightbox").addEventListener("click", (e) => {
  if (e.target.id === "lightbox") closeLightbox();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeLightbox();
});

initGallery();
</script>
</body>
</html>
